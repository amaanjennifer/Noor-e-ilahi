<!DOCTYPE html>
<html lang="en" data-theme="green"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor-e-Ilahi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu&family=Fraunces:wght@600&display=swap">
<style>
[data-theme=green]{--bg:#f3efe0;--card:#fffdf6;--ink:#12302a;--mut:#5f6f67;--g:#14573f;--gold:#b8892b;--line:#e2d9bd;--on:#fff}
[data-theme=dark]{--bg:#0b1f1a;--card:#12332a;--ink:#eef2e6;--mut:#9fb3a8;--g:#2f9a72;--gold:#e0b95a;--line:#1f4a3d;--on:#fff}
[data-theme=blue]{--bg:#e9f0f8;--card:#fff;--ink:#12263f;--mut:#5a6b80;--g:#1d4f8f;--gold:#c58a1b;--line:#cfdbea;--on:#fff}
[data-theme=sand]{--bg:#efe6d2;--card:#fbf6ea;--ink:#2b2318;--mut:#7a6a4c;--g:#8a5a1f;--gold:#b8892b;--line:#dccfae;--on:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:auto;padding:env(safe-area-inset-top,0px) 0 110px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}.sm{color:var(--mut);font-size:13px}
.top{padding:14px 16px}.top h1{font-size:22px}
main{padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--g);color:var(--on);border-radius:22px;padding:18px;margin-bottom:12px}
.hero .big{font:600 34px Fraunces,serif;color:var(--on)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font-size:14px;margin:0 6px 6px 0}
.pill.on{background:var(--g);color:var(--on);border-color:var(--g)}
.btn{background:var(--g);color:var(--on);border:0;border-radius:12px;padding:10px 16px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row.next{color:var(--g);font-weight:700}
.blk{display:block;padding:12px 0}.pl{background:color-mix(in srgb,var(--g) 18%,transparent);border-radius:10px}
.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:27px;line-height:2.1;direction:rtl;text-align:right}
.ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;line-height:2.2;font-size:17px}.en{color:var(--mut)}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.tabs{display:flex;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;padding:4px 0}nav button span{display:block;font-size:19px}nav button.on{color:var(--g);font-weight:700}
#bar{display:none;position:fixed;bottom:calc(62px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;background:var(--g);color:var(--on);border-radius:14px;padding:10px 14px;justify-content:space-between;align-items:center}
#bar button{background:none;border:1px solid var(--on);color:var(--on);border-radius:10px;padding:4px 12px;margin-left:6px}
.big-btn{width:180px;height:180px;border-radius:50%;border:6px solid var(--gold);background:var(--g);color:var(--on);font:600 52px Fraunces,serif;display:block;margin:14px auto}.big-btn:active{transform:scale(.96)}
.dial{width:240px;height:240px;border-radius:50%;border:3px solid var(--line);margin:14px auto;position:relative}
.dial i{position:absolute;inset:0;transition:transform .25s}.dial i:before{content:"";position:absolute;left:50%;top:6px;margin-left:-15px;border:15px solid transparent;border-bottom:95px solid var(--g);border-top:0}
.dial b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px}
</style></head><body>
<div class="top"><h1>Noor-e-Ilahi نورِ الٰہی</h1><div class="sm" id="hj"></div></div>
<main id="v"></main>
<div id="bar"><span id="pn">Playing…</span><span><button id="pp">Pause</button><button id="st">Stop</button></span></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(x){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
let CL=ld("cl2","both"),TH=ld("th","green"),RC=ld("rc","ar.alafasy"),tab="home",sub="qibla",qt="surah";
let loc=ld("loc",{name:"Makkah",lat:21.4225,lng:39.8262});
const PM=ld("pm",{m:1,s:1,t:[0,0,0,0,0,0]}),HA=[],A2="https://api.aladhan.com/v1";
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.speak(u)}catch(x){alert("Voice not supported on this phone")}};
const nowH=tz=>{try{const q=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date()),h=+q.find(x=>x.type=="hour").value%24,m=+q.find(x=>x.type=="minute").value;return h+m/60}catch(x){const n=new Date();return n.getHours()+n.getMinutes()/60}};
async function times(d){try{const j=await J(`${A2}/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=${loc.lat}&longitude=${loc.lng}&method=${PM.m}&school=${PM.s}`),t=j.data.timings;
return{tz:j.data.meta.timezone,rows:[["Fajr","فجر",t.Fajr],["Sunrise","طلوع",t.Sunrise],["Dhuhr","ظہر",t.Dhuhr],["Asr","عصر",t.Asr],["Maghrib","مغرب",t.Maghrib],["Isha","عشاء",t.Isha]].map((x,i)=>{const[h,m]=x[2].slice(0,5).split(":").map(Number);return[x[0],x[1],h+(m+(+PM.t[i]||0))/60]})}}catch(z){return{tz:undefined,rows:prayer(d,loc.lat,loc.lng)}}}
function getLoc(sel,done){const say=t=>{const el=$(sel);if(el)el.textContent=t};say("Getting your location…");
const ok=async(lat,lng,approx)=>{let name=approx?"My area (approx.)":"My location";try{const r=await J(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);name=(r.city||r.locality||r.principalSubdivision||name)+(r.countryName?", "+r.countryName:"")}catch(x){}loc={name,lat,lng};sv("loc",loc);const sd=ld("saved",[]);if(!sd.some(z=>z.name==name)){sd.push(loc);sv("saved",sd)}done()};
const ip=async()=>{try{const r=await J("https://get.geojs.io/v1/ip/geo.json");ok(+r.latitude,+r.longitude,true)}catch(x){say("Location failed. Turn on GPS and allow location for Chrome, or search your city.")}};
if(!navigator.geolocation)return ip();
navigator.geolocation.getCurrentPosition(q=>ok(q.coords.latitude,q.coords.longitude,false),er=>{say(er.code==1?"Location is blocked. Chrome: lock icon → Permissions → Location → Allow. Using approximate location for now…":"GPS not responding. Using approximate location…");ip()},{timeout:12000,maximumAge:600000})}
const M={},A="https://api.alquran.cloud/v1",H="https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/";
const J=async u=>{if(M[u])return M[u];const r=await fetch(u);if(!r.ok)throw 0;return M[u]=await r.json()};
const setV=h=>$("#v").innerHTML=h,load=()=>setV('<div class="card sm">Loading…</div>'),fail=()=>{setV('<div class="card">Could not load. Check your internet and try again.</div><button class="pill" id="fb">← Back</button>');$("#fb").onclick=()=>V[tab]()};onpopstate=()=>{if(tab=="quran")quran()};
const tcls=()=>CL==="ur"?"ur":"en",qe=()=>CL==="ur"?"ur.jalandhry":CL==="en"?"en.sahih":"en.sahih,ur.jalandhry",hp=()=>CL==="ur"?["urd-"]:CL==="en"?["eng-"]:["eng-","urd-"],txt=(l,t)=>`<div class="${l=="ur"?"ur":"en"}">${e(t)}</div>`;
document.documentElement.dataset.theme=TH;

/* Hijri */
const HM=["Muharram","Safar","Rabi’ al-awwal","Rabi’ al-thani","Jumada al-ula","Jumada al-akhira","Rajab","Sha’ban","Ramadan","Shawwal","Dhu al-Qi’dah","Dhu al-Hijjah"];
const hf=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{year:"numeric",month:"numeric",day:"numeric"});
const hparts=t=>{const o={};hf.formatToParts(t).forEach(p=>o[p.type]=+p.value);return o};
const hEN=t=>{const o=hparts(t);return o.day+" "+HM[o.month-1]+" "+o.year+" AH"};
const hAR=t=>new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(t);
function h2g(y,m,d){let t=new Date(Math.floor(y*.970229+621.5744)-1,0,1);for(let i=0;i<800;i++){const o=hparts(t);if(o.year==y&&o.month==m&&o.day==d)return t;t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1)}return null}

/* Prayer times (MWL) */
const R=Math.PI/180,sin=x=>Math.sin(x*R),cos=x=>Math.cos(x*R),fx=(x,m)=>((x%m)+m)%m;
function prayer(d,lat,lng){const tz=-d.getTimezoneOffset()/60,D=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5-2451545,g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*sin(g)+.02*sin(2*g),360),ep=23.439-4e-7*D,dec=Math.asin(sin(ep)*sin(L))/R,ra=fx(Math.atan2(cos(ep)*sin(L),cos(L))/R/15,24),n=fx(12+tz-lng/15-fx(q/15-ra+12,24)+12,24);
const Hh=a=>Math.acos((-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/R/15,Aa=Math.atan(1/(1+Math.tan(Math.abs(lat-dec)*R)))/R,asr=Math.acos((sin(Aa)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/R/15;
return[["Fajr","فجر",n-Hh(18)],["Sunrise","طلوع",n-Hh(.833)],["Dhuhr","ظہر",n+.02],["Asr","عصر",n+asr],["Maghrib","مغرب",n+Hh(.833)],["Isha","عشاء",n+Hh(17)]]}
const fmt=h=>{if(isNaN(h))return"--";let m=Math.round(fx(h,24)*60),a=Math.floor(m/60)%24;return(a%12||12)+":"+String(m%60).padStart(2,"0")+" "+(a<12?"AM":"PM")};
const CITIES=[["Makkah",21.4225,39.8262],["Madinah",24.4672,39.6111],["Karachi",24.8607,67.0011],["Lahore",31.5204,74.3587],["Islamabad",33.6844,73.0479],["Peshawar",34.0151,71.5249],["London",51.5072,-.1276],["New York",40.7128,-74.006],["Dubai",25.2048,55.2708],["Riyadh",24.7136,46.6753]];

/* Audio */
const au=new Audio();let Q=[],cur=0;
function play(i){if(i>=Q.length){stopA();return}cur=i;au.src=`https://cdn.islamic.network/quran/audio/128/${RC}/${Q[i]}.mp3`;au.play().catch(()=>{});document.querySelectorAll(".pl").forEach(x=>x.classList.remove("pl"));const el=$("#a"+Q[i]);if(el){el.classList.add("pl");el.scrollIntoView({block:"center",behavior:"smooth"})}$("#bar").style.display="flex";$("#pp").textContent="Pause"}
function stopA(){au.pause();$("#bar").style.display="none"}
au.onended=()=>play(cur+1);$("#st").onclick=stopA;$("#pp").onclick=()=>{if(au.paused){au.play();$("#pp").textContent="Pause"}else{au.pause();$("#pp").textContent="Resume"}};

/* Views */
async function home(){load();const n=new Date(),saved=ld("saved",[]),R0=await times(n),p=R0.rows,nh=nowH(R0.tz);let ni=p.findIndex(x=>x[0]!=="Sunrise"&&x[2]>nh);if(ni<0)ni=0;const nx=p[ni];
setV(`<div class="hero"><div class="sm" style="color:inherit;opacity:.85">📍 ${e(loc.name)}</div><div class="big">${hEN(n)}</div><div class="ar" style="font-size:22px;line-height:1.6">${hAR(n)}</div><div>${n.toDateString()}</div><div style="margin-top:8px">Next: ${nx[0]} ${nx[1]} · <b>${fmt(nx[2])}</b></div></div>
<div class="card">${p.map((x,i)=>`<div class="row ${i===ni?"next":""}"><span>${x[0]} · ${x[1]}</span><span>${fmt(x[2])}</span></div>`).join("")}<div class="sm">Method can be changed in More → Settings.</div></div>
<div class="card"><button class="btn" id="gps">📍 Use my location</button><div id="gs" class="sm" style="margin-top:6px"></div>
<div class="sm" style="margin:10px 0 4px">Search any city in the world</div><input id="cq" placeholder="e.g. Karachi, London, Jakarta"><button class="pill" id="cs">Search</button><div id="cr"></div>
<div class="sm" style="margin:8px 0 4px">Saved locations</div><div class="tabs">${saved.map((c,i)=>`<button class="pill" data-i="${i}">${e(c.name)}</button>`).join("")||'<span class="sm">None yet</span>'}</div></div>`);
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{loc=saved[b.dataset.i];sv("loc",loc);home()});
$("#gps").onclick=()=>getLoc("#gs",home);
$("#cs").onclick=async()=>{const q=$("#cq").value.trim();if(!q)return;$("#cr").textContent="Searching…";try{const r=await J(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`),L=r.results||[];$("#cr").innerHTML=L.map((c,i)=>`<button class="pill" data-r="${i}">${e(c.name)}${c.admin1?", "+e(c.admin1):""}, ${e(c.country||"")}</button>`).join("")||"No city found";document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const c=L[b.dataset.r];loc={name:c.name+", "+(c.country||""),lat:c.latitude,lng:c.longitude};sv("loc",loc);if(!saved.some(z=>z.name==loc.name)){saved.push(loc);sv("saved",saved)}home()})}catch(x){$("#cr").textContent="Search failed. Check internet."}}}

async function quran(){setV(`<div class="tabs">${[["surah","Surah"],["juz","Juz 1–30"],["manzil","Manzil"],["page","Page"]].map(t=>`<button class="pill ${qt==t[0]?"on":""}" data-q="${t[0]}">${t[1]}</button>`).join("")}</div><div id="ql"></div>`);
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{qt=b.dataset.q;quran()});
const nums=(n,l,t)=>{$("#ql").innerHTML=Array.from({length:n},(_,i)=>`<button class="pill" data-n="${i+1}">${l} ${i+1}</button>`).join("");document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>show(t,+b.dataset.n,l+" "+b.dataset.n))};
if(qt=="juz")nums(30,"Juz","juz");else if(qt=="manzil")nums(7,"Manzil","manzil");
else if(qt=="page"){$("#ql").innerHTML='<div class="card"><input id="qpg" type="number" min="1" max="604" placeholder="Page 1 to 604"><button class="btn" id="pgo">Open page</button></div>';$("#pgo").onclick=()=>{const n=+$("#qpg").value;if(n>=1&&n<=604)show("page",n,"Page "+n)}}
else try{const d=await J(A+"/surah");$("#ql").innerHTML='<div class="card">'+d.data.map(s=>`<div class="row" data-s="${s.number}" style="cursor:pointer"><span><b>${s.number}.</b> ${e(s.englishName)} <span class="sm">${e(s.englishNameTranslation)} · ${s.numberOfAyahs}</span></span><span class="ar" style="font-size:20px;line-height:1.4">${s.name}</span></div>`).join("")+"</div>";document.querySelectorAll("[data-s]").forEach(r=>r.onclick=()=>show("surah",+r.dataset.s,"Surah "+r.dataset.s))}catch(x){fail()}}
async function show(type,n,title){load();history.pushState({q:1},"");try{const d=await Promise.all(["quran-uthmani",...qe().split(",")].map(x=>J(`${A}/${type}/${n}/${x}`))),a=d[0].data.ayahs;Q=a.map(x=>x.number);let last="";
setV(`<button class="pill" id="back">← Back</button><button class="btn" id="all">▶ Play all</button><div class="sm" style="margin:8px 0">${title}</div><div class="card">`+a.map((x,i)=>{const sn=x.surah?x.surah.englishName:"",hd=x.surah&&sn!==last?`<h2 style="margin:12px 0 4px">${e(sn)} · ${x.surah.name}</h2>`:"";last=sn;return hd+`<div class="row blk" id="a${x.number}"><div class="ar">${x.text} <span class="sm">﴿${x.numberInSurah}﴾</span></div>${d.slice(1).map(ed=>txt(ed.data.edition.language,ed.data.ayahs[i].text)).join("")}<button class="pill" data-p="${i}">▶ Play</button></div>`}).join("")+'</div><button class="pill" id="back2">← Back</button>');
$("#back").onclick=$("#back2").onclick=quran;$("#all").onclick=()=>play(0);document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>play(+b.dataset.p));window.scrollTo(0,0)}catch(x){fail()}}

const BK=[["bukhari","Sahih al-Bukhari"],["muslim","Sahih Muslim"],["abudawud","Sunan Abu Dawud"],["tirmidhi","Jami’ at-Tirmidhi"],["nasai","Sunan an-Nasa’i"],["ibnmajah","Sunan Ibn Majah"]];
let hb=0,hs=1;
async function hadith(){setV(`<div class="card"><select id="hb">${BK.map((b,i)=>`<option value="${i}" ${i==hb?"selected":""}>${b[1]}</option>`).join("")}</select><div class="tabs"><button class="pill" id="hpv">← Book</button><input id="hn" type="number" min="1" value="${hs}" style="width:90px;margin:0 6px 6px 0"><button class="pill" id="hgo">Go</button><button class="pill" id="hnx">Book →</button></div></div><div id="hl"></div>`);
const go=n=>{hs=Math.max(1,n);hadith()};$("#hb").onchange=ev=>{hb=+ev.target.value;hs=1;hadith()};$("#hpv").onclick=()=>go(hs-1);$("#hnx").onclick=()=>go(hs+1);$("#hgo").onclick=()=>go(+$("#hn").value);
const k=BK[hb][0];try{const P=hp(),[a,...T]=await Promise.all([J(`${H}ara-${k}/sections/${hs}.json`),...P.map(x=>J(`${H}${x}${k}/sections/${hs}.json`))]),t=T[0];const am={};a.hadiths.forEach(x=>am[x.hadithnumber]=x.text);
const nm=t.metadata&&t.metadata.section?Object.values(t.metadata.section)[0]:"";
$("#hl").innerHTML=`<h2 style="margin:6px 0">Book ${hs}${nm?" · "+e(nm):""}</h2>`+t.hadiths.map((x,hi)=>{HA[hi]=am[x.hadithnumber]||"";return`<div class="card">${am[x.hadithnumber]?`<div class="ar">${e(am[x.hadithnumber])}</div><button class="pill" data-sp="${hi}">🔊 Listen</button>`:""}${T.map((tt,ti)=>{const h=tt.hadiths.find(y=>y.hadithnumber==x.hadithnumber);return h?txt(P[ti]=="urd-"?"ur":"en",h.text):""}).join("")}<div class="sm">${BK[hb][1]} · No. ${x.hadithnumber}${x.grades&&x.grades.length?" · "+e(x.grades.map(g=>g.grade).join(", ")):""}</div></div>`}).join("")||'<div class="card">No hadith in this book.</div>';document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>speak(HA[b.dataset.sp]))}catch(x){$("#hl").innerHTML='<div class="card">Could not load this book. Check internet, or try another number.</div>'}}

const DUA=[["Before eating","کھانے سے پہلے","بِسْمِ ٱللَّهِ","In the name of Allah.","اللہ کے نام سے۔"],
["After eating","کھانے کے بعد","ٱلْحَمْدُ لِلَّهِ ٱلَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ","All praise is for Allah who fed us, gave us drink and made us Muslims.","سب تعریف اللہ کے لیے جس نے ہمیں کھلایا، پلایا اور مسلمان بنایا۔"],
["Waking up","جاگنے کی دعا","ٱلْحَمْدُ لِلَّهِ ٱلَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ ٱلنُّشُورُ","Praise be to Allah who gave us life after causing us to die, and to Him is the resurrection.","سب تعریف اللہ کے لیے جس نے ہمیں موت (نیند) کے بعد زندگی دی اور اسی کی طرف لوٹنا ہے۔"],
["Before sleeping","سونے کی دعا","بِٱسْمِكَ ٱللَّهُمَّ أَمُوتُ وَأَحْيَا","With Your name, O Allah, I die and I live.","اے اللہ! تیرے نام کے ساتھ میں مرتا ہوں اور جیتا ہوں۔"],
["Leaving home","گھر سے نکلتے وقت","بِسْمِ ٱللَّهِ تَوَكَّلْتُ عَلَى ٱللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّهِ","In the name of Allah, I trust in Allah; there is no power or strength except with Allah.","اللہ کے نام سے، میں نے اللہ پر بھروسا کیا؛ گناہ سے بچنے کی طاقت اور نیکی کی قوت اللہ ہی کی طرف سے ہے۔"],
["Entering the masjid","مسجد میں داخل ہوتے وقت","ٱللَّهُمَّ ٱفْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","O Allah, open for me the doors of Your mercy.","اے اللہ! میرے لیے اپنی رحمت کے دروازے کھول دے۔"],
["Leaving the masjid","مسجد سے نکلتے وقت","ٱللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","O Allah, I ask You for Your bounty.","اے اللہ! میں تجھ سے تیرا فضل مانگتا ہوں۔"],
["Travel","سفر کی دعا","سُبْحَانَ ٱلَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ وَإِنَّآ إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ","Glory to Him who subjected this to us, and we could not have done it ourselves; and to our Lord we will return.","پاک ہے وہ ذات جس نے اسے ہمارے بس میں کر دیا، ہم اسے قابو میں لانے والے نہ تھے، اور ہم اپنے رب کی طرف لوٹنے والے ہیں۔"],
["In difficulty","مشکل میں","حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ","Allah is sufficient for us, and He is the best disposer of affairs.","ہمیں اللہ کافی ہے اور وہ بہترین کارساز ہے۔"],
["Forgiveness","مغفرت","رَبِّ ٱغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنتَ ٱلتَّوَّابُ ٱلرَّحِيمُ","My Lord, forgive me and accept my repentance; You are the Accepting of repentance, the Most Merciful.","اے میرے رب! مجھے بخش دے اور میری توبہ قبول کر، بے شک تو توبہ قبول کرنے والا مہربان ہے۔"],
["Increase in knowledge","علم میں اضافہ","رَّبِّ زِدْنِي عِلْمًا","My Lord, increase me in knowledge.","اے میرے رب! میرے علم میں اضافہ فرما۔"],
["For parents","والدین کے لیے","رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","My Lord, have mercy on them as they raised me when I was small.","اے میرے رب! ان دونوں پر رحم فرما جیسے انہوں نے بچپن میں میری پرورش کی۔"],
["Good in both worlds","دنیا و آخرت کی بھلائی","رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةً وَفِى ٱلْءَاخِرَةِ حَسَنَةً وَقِنَا عَذَابَ ٱلنَّارِ","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","اے ہمارے رب! ہمیں دنیا میں بھلائی دے اور آخرت میں بھی بھلائی دے اور ہمیں آگ کے عذاب سے بچا۔"]];
function dua(){setV(DUA.map((d,di)=>`<div class="card"><h2 style="font-size:17px">${d[0]} · <span class="ur" style="font-size:16px">${d[1]}</span></h2><div class="ar">${d[2]}</div><button class="pill" data-sd="${di}">🔊 Listen</button>${CL!="ur"?txt("en",d[3]):""}${CL!="en"?txt("ur",d[4]):""}</div>`).join(""));document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>speak(DUA[b.dataset.sd][2]))}

const TS=[["سُبْحَانَ ٱللَّهِ","SubhanAllah","Glory be to Allah.","Declares that Allah is perfect and free from every fault. Commonly said 33 times after each prayer.","اللہ ہر عیب اور کمی سے پاک ہے۔","اللہ کی پاکی بیان کرنا۔ ہر نماز کے بعد 33 بار پڑھا جاتا ہے۔"],
["ٱلْحَمْدُ لِلَّهِ","Alhamdulillah","All praise is for Allah.","Thanking and praising Allah for every blessing. Commonly said 33 times after each prayer.","سب تعریف اللہ کے لیے ہے۔","ہر نعمت پر اللہ کا شکر اور تعریف۔ ہر نماز کے بعد 33 بار پڑھا جاتا ہے۔"],
["ٱللَّهُ أَكْبَرُ","Allahu Akbar","Allah is the Greatest.","Remembering that Allah is greater than everything. Commonly said 34 times after each prayer (33 in many traditions).","اللہ سب سے بڑا ہے۔","یہ یاد کرنا کہ اللہ ہر چیز سے بڑا ہے۔ نماز کے بعد پڑھا جاتا ہے۔"],
["لَا إِلَٰهَ إِلَّا ٱللَّهُ","La ilaha illallah","There is no god but Allah.","The statement of Tawhid, and the best form of dhikr (Tirmidhi).","اللہ کے سوا کوئی معبود نہیں۔","کلمۂ توحید، اور سب سے افضل ذکر (ترمذی)۔"],
["أَسْتَغْفِرُ ٱللَّهَ","Astaghfirullah","I seek forgiveness from Allah.","Asking Allah to forgive our sins. The Prophet ﷺ made istighfar very often.","میں اللہ سے مغفرت مانگتا ہوں۔","گناہوں کی معافی مانگنا۔ نبی ﷺ بہت کثرت سے استغفار کرتے تھے۔"],
["سُبْحَانَ ٱللَّهِ وَبِحَمْدِهِ","SubhanAllahi wa bihamdihi","Glory and praise be to Allah.","Whoever says it 100 times a day, his sins are forgiven even if like the foam of the sea (Bukhari, Muslim).","اللہ پاک ہے اور اسی کی تعریف ہے۔","جو دن میں 100 بار کہے اس کے گناہ معاف ہو جاتے ہیں چاہے سمندر کی جھاگ کے برابر ہوں (بخاری، مسلم)۔"],
["لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِٱللَّهِ","La hawla wa la quwwata illa billah","There is no power and no strength except with Allah.","Said when in difficulty; it is a treasure from the treasures of Paradise (Bukhari, Muslim).","اللہ کے بغیر نہ کوئی طاقت ہے نہ قوت۔","مشکل میں پڑھی جاتی ہے؛ یہ جنت کے خزانوں میں سے ایک خزانہ ہے (بخاری، مسلم)۔"],
["ٱللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ","Durood (Salawat)","O Allah, send blessings upon Muhammad ﷺ.","Sending blessings on the Prophet ﷺ; for each one, Allah sends ten blessings on the sender (Muslim).","اے اللہ! محمد ﷺ پر رحمت نازل فرما۔","نبی ﷺ پر درود بھیجنا؛ ہر ایک درود کے بدلے اللہ دس رحمتیں بھیجتا ہے (مسلم)۔"]];
let AC;const beep=(f,d)=>{if(!ld("snd",true))return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(x){}};
function tasbeeh(){const s=ld("tas",{i:0,c:0,t:33,tot:0}),z=TS[s.i];
setV(`<div class="card"><select id="dh">${TS.map((d,i)=>`<option value="${i}" ${i==s.i?"selected":""}>${d[1]}</option>`).join("")}</select><div class="ar" style="text-align:center">${z[0]}</div>
<button class="big-btn" id="tb">${s.c}</button><div style="text-align:center" id="pg">${s.c} / ${s.t}</div>
<div class="row"><span>Target</span><select id="tg" style="width:110px;margin:0">${[33,99,100,500,1000].map(n=>`<option ${n==s.t?"selected":""}>${n}</option>`).join("")}</select></div>
<div class="tabs" style="margin-top:8px"><button class="pill" id="rs">Reset</button><button class="pill" id="ls">🔊 Listen</button></div><div class="sm">All-time: ${s.tot}</div></div>
<div class="card"><h2 style="font-size:17px">Meaning · مطلب</h2>${txt("en",z[2])}${txt("ur",z[4])}<h2 style="font-size:17px;margin-top:10px">Why we say it · کیوں پڑھتے ہیں</h2>${txt("en",z[3])}${txt("ur",z[5])}</div>`);
$("#tb").onclick=()=>{s.c++;s.tot++;if(s.c>=s.t){navigator.vibrate&&navigator.vibrate([200,80,200]);s.c=0}else{navigator.vibrate&&navigator.vibrate(12)}sv("tas",s);$("#tb").textContent=s.c;$("#pg").textContent=s.c+" / "+s.t};
$("#rs").onclick=()=>{s.c=0;sv("tas",s);tasbeeh()};$("#ls").onclick=()=>speak(z[0]);$("#dh").onchange=ev=>{s.i=+ev.target.value;s.c=0;sv("tas",s);tasbeeh()};$("#tg").onchange=ev=>{s.t=+ev.target.value;sv("tas",s);tasbeeh()}}

const qb=()=>{const a=loc.lat,b=21.4225,dl=39.8262-loc.lng;return fx(Math.atan2(sin(dl)*cos(b),cos(a)*sin(b)-sin(a)*cos(b)*cos(dl))/R,360)};
const dist=()=>{const dl=39.8262-loc.lng,dp=21.4225-loc.lat,x=sin(dp/2)**2+cos(loc.lat)*cos(21.4225)*sin(dl/2)**2;return 12742*Math.asin(Math.sqrt(x))};
let compassOn=false;
function more(){const q=Math.round(qb());
setV(`<div class="tabs">${["qibla","hijri","settings"].map(k=>`<button class="pill ${sub==k?"on":""}" data-k="${k}">${{qibla:"Qibla",hijri:"Hijri converter",settings:"Settings"}[k]}</button>`).join("")}</div><div id="mb"></div>`);
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{sub=b.dataset.k;more()});const mb=$("#mb");
if(sub=="qibla"){mb.innerHTML=`<div class="card" style="text-align:center"><div class="sm">${e(loc.name)}</div><h2>${q}° from North · ${Math.round(dist())} km</h2><div class="dial"><i id="nd" style="transform:rotate(${q}deg)"></i><b>🕋</b></div><div id="qn" class="sm">Tap Start compass, then turn until the arrow points straight up.</div><br><button class="btn" id="cp">Start compass</button> <button class="pill" id="qg">📍 Use my location</button></div>`;
$("#qg").onclick=()=>getLoc("#qn",more);
$("#cp").onclick=async()=>{try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission&&(await DeviceOrientationEvent.requestPermission())!=="granted")throw 0;
let got=0;const f=ev=>{let h=null;if(ev.webkitCompassHeading!=null)h=ev.webkitCompassHeading;else if((ev.absolute||ev.type=="deviceorientationabsolute")&&ev.alpha!=null){const x=ev.beta*R,y=ev.gamma*R,z=ev.alpha*R,vx=-Math.cos(z)*Math.sin(y)-Math.sin(z)*Math.sin(x)*Math.cos(y),vy=-Math.sin(z)*Math.sin(y)+Math.cos(z)*Math.sin(x)*Math.cos(y);h=fx(Math.atan2(vx,vy)/R,360)}if(h==null)return;got=1;const r=fx(q-h,360);$("#nd").style.transform=`rotate(${r}deg)`;const ok=r<6||r>354;$("#qn").textContent=ok?"✅ You are facing Qibla":"Phone heading "+Math.round(h)+"° · turn until the arrow points up"};
setTimeout(()=>{if(!got)$("#qn").textContent="No compass data. In Chrome: Settings → Site settings → Motion sensors → Allow. Also try moving the phone in a figure 8."},2500);
addEventListener("deviceorientationabsolute",f,true);addEventListener("deviceorientation",f,true);$("#qn").textContent="Compass on. Keep the phone flat."}catch(x){$("#qn").textContent="Compass not available on this phone/browser. Use the degrees above with any compass."}}}
if(sub=="hijri"){const t=new Date(),iso=t.toISOString().slice(0,10);mb.innerHTML=`<div class="card"><h2 style="font-size:17px">Today</h2><div>${hEN(t)}</div><div class="ar" style="font-size:22px;line-height:1.8">${hAR(t)}</div></div>
<div class="card"><h2 style="font-size:17px">English date → Islamic date</h2><input type="date" id="gd" value="${iso}"><div id="go1"></div></div>
<div class="card"><h2 style="font-size:17px">Islamic date → English date</h2><div class="tabs"><input id="hy" type="number" placeholder="Year" value="${hparts(t).year}" style="width:32%;margin-right:2%"><select id="hm" style="width:32%;margin-right:2%">${HM.map((m,i)=>`<option value="${i+1}" ${i+1==hparts(t).month?"selected":""}>${m}</option>`).join("")}</select><input id="hdy" type="number" placeholder="Day" value="${hparts(t).day}" style="width:30%"></div><button class="btn" id="hc">Convert</button><div id="go2" style="margin-top:8px"></div></div>
<div class="sm">Dates follow the Umm al-Qura calendar. The moon sighting in your country can differ by a day.</div>`;
const c1=()=>{const v=$("#gd").value;if(!v)return;const d=new Date(v+"T12:00:00");$("#go1").innerHTML=`<b>${hEN(d)}</b><div class="ar" style="font-size:22px;line-height:1.8">${hAR(d)}</div>`};$("#gd").onchange=c1;c1();
$("#hc").onclick=()=>{const d=h2g(+$("#hy").value,+$("#hm").value,+$("#hdy").value);$("#go2").innerHTML=d?`<b>${d.toDateString()}</b>`:"Date not found. Check the year, month and day."}}
if(sub=="settings"){mb.innerHTML=`<div class="card"><h2 style="font-size:17px">Translation language</h2><div class="sm">Arabic text always shows. Choose what appears under it.</div><br><button class="pill ${CL=="both"?"on":""}" data-l="both">English + اردو</button><button class="pill ${CL=="en"?"on":""}" data-l="en">English</button><button class="pill ${CL=="ur"?"on":""}" data-l="ur">اردو</button></div>
<div class="card"><h2 style="font-size:17px">Theme</h2><br>${[["green","Green"],["dark","Dark"],["blue","Blue"],["sand","Sand"]].map(t=>`<button class="pill ${TH==t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
<div class="card"><h2 style="font-size:17px">Quran reciter</h2><select id="rc">${[["ar.alafasy","Mishary Alafasy"],["ar.abdurrahmaansudais","Abdur-Rahman As-Sudais"],["ar.husary","Mahmoud Khalil Al-Husary"],["ar.abdulbasitmurattal","Abdul Basit (Murattal)"]].map(r=>`<option value="${r[0]}" ${RC==r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></div>`;
mb.insertAdjacentHTML("beforeend",`<div class="card"><h2 style="font-size:17px">Prayer times</h2><div class="sm">Pakistan/India: Karachi + Hanafi. Change it if your mosque follows another method.</div><br><select id="pm">${[[1,"Karachi (Univ. of Islamic Sciences)"],[3,"Muslim World League"],[2,"ISNA (North America)"],[5,"Egyptian"],[4,"Umm al-Qura (Makkah)"],[8,"Gulf"],[13,"Turkey (Diyanet)"],[15,"Moonsighting Committee"]].map(m=>`<option value="${m[0]}" ${PM.m==m[0]?"selected":""}>${m[1]}</option>`).join("")}</select><select id="ps"><option value="1" ${PM.s==1?"selected":""}>Asr: Hanafi</option><option value="0" ${PM.s==0?"selected":""}>Asr: Shafi / Standard</option></select><div class="sm">Adjust minutes (+ or −) to match your mosque:</div>${["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"].map((n,i)=>`<div class="row"><span>${n}</span><input type="number" data-tn="${i}" value="${PM.t[i]}" style="width:90px;margin:0"></div>`).join("")}</div>`);
$("#pm").onchange=ev=>{PM.m=+ev.target.value;sv("pm",PM)};$("#ps").onchange=ev=>{PM.s=+ev.target.value;sv("pm",PM)};document.querySelectorAll("[data-tn]").forEach(i=>i.onchange=()=>{PM.t[+i.dataset.tn]=+i.value||0;sv("pm",PM)});
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{CL=b.dataset.l;sv("cl2",CL);more()});document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{TH=b.dataset.t;sv("th",TH);document.documentElement.dataset.theme=TH;more()});$("#rc").onchange=ev=>{RC=ev.target.value;sv("rc",RC)}}}

const V={home,quran,hadith,dua,tasbeeh,more},NAV=[["home","🏠","Home"],["quran","📖","Quran"],["hadith","📜","Hadith"],["dua","🤲","Dua"],["tasbeeh","📿","Tasbeeh"],["more","☰","More"]];
function go(){$("#nav").innerHTML=NAV.map(n=>`<button class="${n[0]==tab?"on":""}" data-n="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("");document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{tab=b.dataset.n;go()});$("#hj").textContent=hEN(new Date());V[tab]()}
go();
</script></body></html>
